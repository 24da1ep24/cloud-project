
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Мои задачи</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 35px 20px;
    background: #f4f6fa;
    color: #172033;
    font-family: Arial, sans-serif;
}

.container {
    max-width: 750px;
    margin: 0 auto;
    background: white;
    padding: 28px;
    border-radius: 16px;
    box-shadow: 0 5px 25px rgba(0,0,0,0.06);
}

.car-photo {
    width: 180px;
    height: 150px;
    object-fit: cover;
    object-position: center;
    border-radius: 50%;
    display: block;
    margin-bottom: 22px;
}

h1 {
    font-size: 34px;
    margin: 10px 0;
}

.subtitle {
    color: #64748b;
    margin-bottom: 28px;
}

input {
    padding: 13px;
    font-size: 16px;
    border: 1px solid #cbd5e1;
    border-radius: 7px;
    margin: 5px 3px 8px 0;
    max-width: 100%;
}

button {
    padding: 11px 16px;
    font-size: 15px;
    border: none;
    border-radius: 7px;
    cursor: pointer;
    margin: 4px 3px 4px 0;
    background: #2563eb;
    color: white;
}

button:hover {
    background: #1d4ed8;
}

button:disabled {
    background: #94a3b8;
    cursor: default;
}

.auth-box {
    margin-top: 20px;
}

#app {
    display: none;
}

.top-line {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
}

.task-form {
    display: flex;
    gap: 8px;
    margin: 20px 0;
}

.task-form input {
    flex: 1;
    min-width: 0;
}

ul {
    list-style: none;
    padding: 0;
}

li {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    padding: 13px;
    margin-bottom: 10px;
    background: #f8fafc;
    border: 1px solid #e2e8f0;
    border-radius: 8px;
}

.task-title {
    overflow-wrap: anywhere;
}

.completed {
    text-decoration: line-through;
    color: #94a3b8;
}

.delete-btn {
    background: #ef4444;
}

.delete-btn:hover {
    background: #dc2626;
}

.message {
    margin-top: 12px;
    color: #dc2626;
    font-size: 14px;
}

.counter {
    margin-top: 18px;
    color: #475569;
    font-weight: bold;
}

.logout {
    background: #64748b;
}

@media (max-width: 550px) {
    .container {
        padding: 20px;
    }

    h1 {
        font-size: 28px;
    }

    .task-form {
        flex-direction: column;
    }

    li {
        align-items: flex-start;
        flex-wrap: wrap;
    }
}
</style>
</head>

<body>

<div class="container">

    <img class="car-photo"
         src="car.jpg"
         alt="Mercedes CLS 63">

    <h1>Мои задачи</h1>
    <p class="subtitle">
        Сайт Абдукадырова Далера<br>
        Управляй своими задачами онлайн!
    </p>

    <div id="auth" class="auth-box">
        <h2>Вход в аккаунт</h2>

        <input
            type="email"
            id="email"
            placeholder="Почта"
        >

        <input
            type="password"
            id="password"
            placeholder="Пароль (от 6 символов)"
        >

        <br>

        <button onclick="register()">Регистрация</button>
        <button onclick="login()">Войти</button>

        <div id="authMessage" class="message"></div>
    </div>

    <div id="app">

        <div class="top-line">
            <span id="userEmail"></span>
            <button class="logout" onclick="logout()">Выйти</button>
        </div>

        <h2>Мои задачи</h2>

        <div class="task-form">
            <input
                type="text"
                id="taskInput"
                placeholder="Введите новую задачу"
            >
            <button onclick="addTask()">Добавить</button>
        </div>

        <ul id="taskList"></ul>

        <div id="counter" class="counter">
            Всего задач: 0 | Выполнено: 0
        </div>

        <div id="taskMessage" class="message"></div>

    </div>
</div>

<script>
const SUPABASE_URL =
    "https://ybvrtxshvlkogxnhvlhd.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_sOGKla2UlCvhhC_oeLYYWw_4CFgg7GU";

const db = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

let currentUser = null;

function showMessage(id, message) {
    document.getElementById(id).textContent = message;
}

function updateScreen() {
    document.getElementById("auth").style.display =
        currentUser ? "none" : "block";

    document.getElementById("app").style.display =
        currentUser ? "block" : "none";

    if (currentUser) {
        document.getElementById("userEmail").textContent =
            "Вы вошли как: " + currentUser.email;

        loadTasks();
    }
}

async function register() {
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    if (!email || !password) {
        showMessage("authMessage", "Заполните почту и пароль");
        return;
    }

    const { data, error } = await db.auth.signUp({
        email: email,
        password: password,
        options: {
            emailRedirectTo: window.location.origin +
                window.location.pathname
        }
    });

    if (error) {
        showMessage("authMessage", error.message);
        return;
    }

    if (!data.session) {
        showMessage(
            "authMessage",
            "Регистрация успешна! Проверьте почту и подтвердите аккаунт."
        );
    } else {
        showMessage("authMessage", "Регистрация успешна!");
    }
}

async function login() {
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    if (!email || !password) {
        showMessage("authMessage", "Заполните почту и пароль");
        return;
    }

    const { error } = await db.auth.signInWithPassword({
        email: email,
        password: password
    });

    if (error) {
        showMessage("authMessage", error.message);
    }
}

async function logout() {
    const { error } = await db.auth.signOut();

    if (error) {
        showMessage("taskMessage", error.message);
    }
}

async function loadTasks() {
    if (!currentUser) return;

    const { data, error } = await db
        .from("tasks")
        .select("*")
        .eq("user_id", currentUser.id)
        .order("created_at", { ascending: false });

    if (error) {
        showMessage("taskMessage", "Ошибка загрузки: " + error.message);
        return;
    }

    const list = document.getElementById("taskList");
    list.replaceChildren();

    let completed = 0;

    data.forEach(task => {
        if (task.done) completed++;

        const li = document.createElement("li");

        const title = document.createElement("span");
        title.className = "task-title";
        title.textContent = task.title;

        if (task.done) {
            title.classList.add("completed");
        }

        const buttons = document.createElement("div");

        const doneBtn = document.createElement("button");
        doneBtn.textContent = task.done ? "Готово" : "Сделано";
        doneBtn.disabled = task.done;
        doneBtn.onclick = () => completeTask(task.id);

        const deleteBtn = document.createElement("button");
        deleteBtn.textContent = "Удалить";
        deleteBtn.className = "delete-btn";
        deleteBtn.onclick = () => deleteTask(task.id);

        buttons.append(doneBtn, deleteBtn);
        li.append(title, buttons);
        list.appendChild(li);
    });

    document.getElementById("counter").textContent =
        "Всего задач: " + data.length +
        " | Выполнено: " + completed;
}

async function addTask() {
    if (!currentUser) return;

    const input = document.getElementById("taskInput");
    const title = input.value.trim();

    if (!title) {
        showMessage("taskMessage", "Введите название задачи");
        return;
    }

    const { error } = await db
        .from("tasks")
        .insert({
            title: title,
            done: false,
            user_id: currentUser.id
        });

    if (error) {
        showMessage("taskMessage", "Ошибка добавления: " + error.message);
        return;
    }

    input.value = "";
    showMessage("taskMessage", "");
    await loadTasks();
}

async function completeTask(id) {
    const { error } = await db
        .from("tasks")
        .update({ done: true })
        .eq("id", id)
        .eq("user_id", currentUser.id);

    if (error) {
        showMessage("taskMessage", "Ошибка изменения: " + error.message);
        return;
    }

    showMessage("taskMessage", "");
    await loadTasks();
}

async function deleteTask(id) {
    const { error } = await db
        .from("tasks")
        .delete()
        .eq("id", id)
        .eq("user_id", currentUser.id);

    if (error) {
        showMessage("taskMessage", "Ошибка удаления: " + error.message);
        return;
    }

    showMessage("taskMessage", "");
    await loadTasks();
}

document.getElementById("taskInput").addEventListener(
    "keydown",
    function(event) {
        if (event.key === "Enter") {
            addTask();
        }
    }
);

db.auth.onAuthStateChange((event, session) => {
    currentUser = session ? session.user : null;
    updateScreen();
});

async function init() {
    const { data, error } = await db.auth.getSession();

    if (error) {
        showMessage("authMessage", error.message);
        return;
    }

    currentUser = data.session ? data.session.user : null;
    updateScreen();
}

init();
</script>

</body>
</html>
